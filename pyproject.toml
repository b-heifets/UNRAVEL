[project]
name = "heifetslab-unravel"
version = "1.0.0b14"
description = "UNRAVEL: UN-biased high-Resolution Analysis and Validation of Ensembles using Light sheet images"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Daniel Ryskamp Rijsketic", email = "danrijs@stanford.edu" }, 
    { name = "Austen Brooks Casey", email = "abcasey@stanford.edu" }, 
    { name = "Boris Dov Heifets", email = "bheifets@stanford.edu" }
]
maintainers = [
    { name = "Daniel Ryskamp Rijsketic", email = "danrijs@stanford.edu" }
]
dependencies = [
    "aicspylibczi>=3.1.2,<4.0.0",
    "antspyx>=0.4.2,<1.0.0",
    "anndata==0.10.9,<1.0.0",
    "boto3==1.28.17",
    "botocore==1.31.17",
    "connected_components_3d>=3.24.0,<4.0.0",
    "czifile>=2019.7.2,<2020.0.0",
    "dask>=2023.4.1,<2024.0.0",
    "fslpy>=3.18.2,<4.0.0",
    "h5py>=3.8.0,<4.0.0",
    "lxml>=4.9.3,<5.0.0",
    "matplotlib>=3.7.1,<4.0.0",
    "mplcursors>=0.5.2,<1.0.0",
    "nibabel>=5.2.1,<6.0.0",
    "numpy==1.24.4",  # was "numpy>=1.25.2,<2.0.0". 1.25 or 1.26 causes a warning in WSL
    # "numpy>=2.4,<2.5", # Needed for zarr v3, but causes an error (function not in v2). 
    "opencv_python>=4.7.0.72,<5.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "pandas>=1.5.3,<2.0.0",
    "rich>=13.7.1,<14.0.0",
    "rich_argparse>=1.4.0,<2.0.0",
    "s3transfer==0.6.1",
    # "scipy>=1.13.1,<2.0.0", # This was causing an issue with loading h5ad files with backed mode and then ad[cell_filtered.index, gene_filtered.index].to_df()
    "scipy==1.14.1",
    "seaborn>=0.13.2,<1.0.0",
    "setuptools>=77.0.0",
    "SimpleITK>=2.4.0,<3.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "termcolor>=2.4.0,<3.0.0",
    "tifffile>=2023.8.30,<2024.0.0",
    "zarr>=2.14.2,<3.0.0" 
    # "zarr>=3.1.6,<3.2" # v3 need for loading v3 zarr images (GTA STPT images with max level 5). Numpy v2 required, but will require refactor
]

keywords = ["neuroscience", "image analysis", "light sheet microscopy", "brain mapping", "data analysis", "voxel-wise analysis", "cell density quantification"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.optional-dependencies]
dev = [
    "myst-parser",
    "python-cfonts",
    "pydata_sphinx_theme",
    "ruff",
    "sphinx",
    "sphinx-autobuild", 
    "sphinx-togglebutton", 
    "sphinx-design",
    "sphinxcontrib-mermaid",
    "build",
    "twine"
]

[project.urls]
"Homepage" = "https://github.com/b-heifets/UNRAVEL"
"Documentation" = "https://b-heifets.github.io/UNRAVEL/"

[tool.setuptools]
package-dir = {"" = "."}
packages = { find = {} }
license-files = []

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

